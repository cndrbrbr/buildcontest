# Buildcontest - Grundkonfiguration
# Siehe rules.md im Projekt-Root fuer die vollstaendige Spielbeschreibung.
# Die Punktetabelle liegt separat in scoreboard-config.yml.

groups:
  count: 2
  max-size: 5
  # Zuweisungsmodus: FREE (Spieler waehlen per /bc join) oder CONFIG (siehe assignments)
  # Nicht gemischt - siehe rules.md#gruppen.
  assignment-mode: FREE
  # Nur relevant wenn assignment-mode: CONFIG
  # Minecraft-Namen -> Gruppennummer (1-basiert)
  assignments: {}
    # Alex: 1
    # Notch: 2

plots:
  size-x: 60
  size-z: 60
  min-distance: 200
  max-distance: 500
  # Y-Level, auf das die Bauplaetze planiert werden
  surface-y: 64
  # Mittelpunkt, um den die Bauplaetze verteilt werden
  center-x: 0
  center-z: 0
  # Darf NICHT die Standard-Hauptwelt des Servers sein (aus server.properties
  # level-name, i. d. R. "world")! Bukkit kann diese zur Laufzeit nicht
  # entladen/neu erzeugen. /bc start loescht diese Welt bei jedem Lauf komplett
  # und erzeugt sie mit einem zufaelligen Seed neu (siehe rules.md#setup-admin,
  # "frische Welt"); dafuer muss es eine dedizierte, separate Welt sein.
  world: buildcontest_world

game:
  # Spieldauer in Minuten, 0 = kein automatisches Ende (nur /bc end)
  duration-minutes: 0
  # Intervall in Minuten, in dem der Spielstand (Gruppen, Bauplaetze, Scores)
  # zusaetzlich zum Speichern bei /reload bzw. Serverstop automatisch
  # gesichert wird, damit ein Absturz moeglichst wenig Fortschritt kostet.
  # 0 = deaktiviert.
  autosave-minutes: 5
  # Bauplatz-Welt bei /bc end automatisch komplett loeschen (siehe
  # rules.md#spielablauf--ende)? Bei false bleibt sie stehen, bis ein Admin
  # sie per /bc deleteworld manuell entfernt oder /bc start sie beim naechsten
  # Contest ohnehin neu erzeugt (was die alte Welt ebenfalls loescht).
  auto-delete-world-on-end: false
