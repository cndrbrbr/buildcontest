# Buildcontest – Punktetabelle (Block -> Score)
#
# Tier-System (grob verdoppelnd, orientiert an der tatsaechlichen
# Beschaffungs-/Verarbeitungskurve von Minecraft-Ressourcen):
#
#   T0 =  0  Punkte  -> funktionale Bloecke (Redstone-Komponenten, Workstations,
#                       Container, Rails, ...) UND reine Dekoration (Teppich,
#                       Banner, Schild, Bild, Blumentopf, Kerze, Laub, ...)
#                       zaehlen GRUNDSAETZLICH 0, unabhaengig vom Materialwert
#                       der Zutaten. Ausnahme: Beacon und Conduit (siehe T6),
#                       da sie trotz "Funktion" extremen Ressourcenaufwand
#                       repraesentieren.
#   T1 =  1  Punkt   -> trivialer Rohstoff / Oberflaechenmaterial
#   T2 =  3  Punkte  -> leichte Verarbeitung (Ofen/Stonecutter, haeufige Bloecke)
#   T3 =  6  Punkte  -> moderate Seltenheit (Tiefbau-Standard, Nether/Ozean-Content)
#   T4 =  12 Punkte  -> hohe Seltenheit (Edelressourcen roh bzw. Eisen/Gold-Bloecke)
#   T5 =  25 Punkte  -> seltenste reguläre Bloecke (Diamant/Emerald-Ebene)
#   T6 =  50 Punkte  -> Unikat-Cap: extrem seltene/einzigartige Bloecke
#                       (Boss-Loot, Endgame-Crafting-Ketten). Diese Stufe ist
#                       bewusst GEDECKELT - alle Eintraege hier sind gleich
#                       viel wert, es gibt keine weitere Eskalation nach oben.
#
# Alles was hier nicht gelistet ist, zaehlt automatisch default_score (0).
#
# Formvarianten-Vererbung (spart tausende Einzelzeilen):
# Folgende Suffixe/Praefixe eines gelisteten Basis-Materials erben automatisch
# dessen Punktwert, da sie nur dieselbe Ressource in anderer Form sind:
#   _STAIRS, _SLAB, _WALL, _FENCE, _FENCE_GATE, _DOOR, _TRAPDOOR,
#   STRIPPED_-Praefix, _WOOD-Suffix (z. B. STRIPPED_OAK_WOOD -> wie OAK_LOG)
# AUSGENOMMEN von der Vererbung (bleiben immer 0, da funktional/informativ):
#   _BUTTON, _PRESSURE_PLATE, _SIGN, _HANGING_SIGN, _BOAT, _BED
#
# Nicht gelistete Sonderfaelle (bleiben auf 0 / sind nicht survival-relevant):
#   BEDROCK, BARRIER, COMMAND_BLOCK*, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW,
#   LIGHT, SPAWNER, END_PORTAL_FRAME, END_PORTAL, END_GATEWAY, NETHER_PORTAL,
#   WATER, LAVA, FIRE, AIR, CAVE_AIR, VOID_AIR, MOVING_PISTON,
#   SCULK_VEIN, AMETHYST_CLUSTER/BUD (nicht ohne Silk Touch bewegbar),
#   alle Redstone-Komponenten, Workstations (Crafting Table, Oefen, Anvil,
#   Enchanting Table, Brewing Stand, Grindstone, Loom, ...), Container
#   (Chest, Barrel, Ender Chest, Hopper, Dispenser, Dropper), Rails,
#   Note Block, Jukebox, Daylight Detector, Target, Lectern

